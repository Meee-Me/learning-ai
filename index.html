<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Max, an AI tutor that teaches step by step, quizzes you, or gives hints only, at your level.">
<title>Max Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one-screen study desk — header with Max, a settings strip, chat column, composer pinned at bottom */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --ink: #18223a;
  --muted: #5d6a85;
  --line: #dbe2ef;
  --accent: #2f6bff;
  --accent-ink: #ffffff;
  --max-bubble: #e8efff;
  --you-bubble: #18223a;
  --you-ink: #f3f6fb;
  --chalk: #ffcf4a;
  --font-display: "Fredoka", "Nunito Sans", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424; --surface: #171e33; --ink: #e8edf8; --muted: #9aa6c2; --line: #2a3452;
    --accent: #6f98ff; --accent-ink: #0f1424; --max-bubble: #1e2a4a; --you-bubble: #e8edf8; --you-ink: #0f1424;
    --chalk: #ffd666; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #171e33; --ink: #e8edf8; --muted: #9aa6c2; --line: #2a3452;
  --accent: #6f98ff; --accent-ink: #0f1424; --max-bubble: #1e2a4a; --you-bubble: #e8edf8; --you-ink: #0f1424;
  --chalk: #ffd666; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; gap: 12px; box-sizing: border-box; }
header { display: flex; align-items: center; gap: 12px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 22px; flex: none; position: relative; }
.avatar::after { content: ""; position: absolute; right: 1px; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--chalk); border: 2px solid var(--bg); }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0; line-height: 1.1; }
.tag { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
header .spacer { flex: 1; }
.btn-ghost { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font: 600 13px var(--font-body); cursor: pointer; }
.btn-ghost:hover { color: var(--ink); border-color: var(--muted); }

.settings { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.field input, .field select { font: 600 13px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.field input { width: 140px; }
.modes { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.modes button { border: 0; background: none; color: var(--muted); font: 600 13px var(--font-body); padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 2px 8px; }
.msg { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.msg .mini { width: 28px; height: 28px; font-size: 14px; }
.msg .mini::after { display: none; }
.bubble { background: var(--max-bubble); border-radius: 4px 16px 16px 16px; padding: 10px 14px; max-width: 85%; min-width: 0; overflow-wrap: anywhere; }
.msg.you { justify-content: flex-end; }
.msg.you .bubble { background: var(--you-bubble); color: var(--you-ink); border-radius: 16px 4px 16px 16px; white-space: pre-wrap; }
.bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
.bubble code { font-family: var(--font-mono); font-size: 13px; background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 1px 5px; border-radius: 4px; }
.bubble pre { font-family: var(--font-mono); font-size: 13px; background: var(--surface); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
.bubble pre code { background: none; padding: 0; }
.bubble h3 { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 6px 0 4px; }
.thinking { color: var(--muted); font-style: italic; }
.example-note { align-self: center; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { background: var(--surface); border: 1px dashed var(--line); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 13px var(--font-body); cursor: pointer; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }

form.composer { display: flex; gap: 8px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
form.composer textarea { flex: 1; min-width: 0; border: 0; resize: none; background: none; color: var(--ink); font: 15px var(--font-body); line-height: 1.45; padding: 6px 6px; max-height: 140px; outline: none; }
.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 9px 16px; font: 600 14px var(--font-body); cursor: pointer; }
.send:disabled { opacity: .5; cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: 12px; color: var(--muted); min-height: 1em; margin: -4px 4px 0; }
@media (max-width: 480px) { .field input { width: 110px; } .tag { display: none; } }
.loadbar { display: flex; flex-direction: column; gap: 4px; }
.loadbar p { margin: 0; font-size: 12px; color: var(--muted); }
.loadtrack { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.loadfill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">M</div>
    <div>
      <h1>Max</h1>
      <p class="tag">Your patient tutor. Runs free, right on your device.</p>
    </div>
    <div class="spacer"></div>
    <button class="btn-ghost" id="newBtn" type="button">New lesson</button>
  </header>

  <div class="settings">
    <label class="field">Subject <input id="subject" type="text" placeholder="e.g. fractions" value=""></label>
    <label class="field">Level
      <select id="level">
        <option>Kid (8–11)</option>
        <option>Middle school</option>
        <option selected>High school</option>
        <option>College</option>
        <option>Adult beginner</option>
      </select>
    </label>
    <label class="field">Brain
      <select id="model">
        <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Fast (0.9 GB)</option>
        <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC" selected>Smarter (1.6 GB)</option>
      </select>
    </label>
    <div class="modes" role="group" aria-label="How Max helps">
      <button type="button" data-mode="teach" aria-pressed="true">Teach me</button>
      <button type="button" data-mode="quiz" aria-pressed="false">Quiz me</button>
      <button type="button" data-mode="hint" aria-pressed="false">Hints only</button>
    </div>
  </div>

  <div class="chat" id="chat" aria-live="polite"></div>

  <div class="chips" id="chips">
    <button type="button">Explain photosynthesis simply</button>
    <button type="button">Help me solve 3x + 5 = 20</button>
    <button type="button">Quiz me on the planets</button>
    <button type="button">What is a variable in coding?</button>
  </div>

  <div class="loadbar" id="loadbar" hidden>
    <div class="loadtrack"><div class="loadfill" id="loadfill"></div></div>
    <p id="loadtext">Downloading Max's brain…</p>
  </div>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Ask Max a question…" aria-label="Your message"></textarea>
    <button class="send" id="sendBtn" type="submit">Send</button>
  </form>
  <p class="status" id="status"></p>
</div>

<script type="module">
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.87/+esm";

const MODES = {
  teach: "TEACH ME. Explain the idea in small steps with a simple example or analogy for the level. Then ask ONE short question to check understanding.",
  quiz: "QUIZ ME. Ask one question at a time and wait. When the student answers, say if it is right, explain why in one or two sentences, then ask the next, slightly harder question. Keep score like (Score: 2/3).",
  hint: "HINTS ONLY. Never give the final answer. Give one small hint or guiding question so the student does the work.",
};
const systemPrompt = (subject, level, mode) => `You are Max, a warm, patient, encouraging tutor. Student level: ${level}.${subject ? " Subject: " + subject + "." : ""}
Mode: ${MODES[mode]}
Rules: keep replies short (under 120 words). Use short paragraphs, bullet lists and **bold** key words. Be kind about mistakes: point to the exact wrong step and let them retry. Guide homework instead of just giving answers. Write math in plain text like 3x + 5 = 20. If you are not sure about a fact, say so.`;

let engine = null, loading = null, loadedModel = null;
const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("sendBtn"), statusEl = $("status"), chips = $("chips");
let mode = "teach";
let turns = [];
let ctl = null;
let busy = false;

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}
function md(src) {
  const parts = esc(src).split(/```/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2) { html += "<pre><code>" + part.replace(/^[a-z]*\n/, "") + "</code></pre>"; return; }
    const lines = part.split("\n");
    let list = null, para = [];
    const flushP = () => { if (para.length) { html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } };
    const flushL = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const raw of lines) {
      const line = raw.trimEnd();
      let m;
      if (!line.trim()) { flushP(); flushL(); continue; }
      if ((m = line.match(/^#{1,4}\s+(.*)/))) { flushP(); flushL(); html += "<h3>" + inline(m[1]) + "</h3>"; continue; }
      if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (list !== "ul") { flushL(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (list !== "ol") { flushL(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
      flushL(); para.push(line);
    }
    flushP(); flushL();
  });
  return html;
}

function addMsg(role, text) {
  const row = document.createElement("div");
  row.className = "msg " + (role === "user" ? "you" : "max");
  const b = document.createElement("div");
  b.className = "bubble";
  if (role === "user") b.textContent = text; else b.innerHTML = md(text);
  if (role !== "user") {
    const a = document.createElement("div"); a.className = "avatar mini"; a.textContent = "M"; a.setAttribute("aria-hidden", "true");
    row.appendChild(a);
  }
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

function welcome() {
  chat.innerHTML = "";
  addMsg("assistant", "Hi, I'm **Max**! 👋 I'm here to help you *understand* things, not just memorize them.\n\nPick a subject and level above, choose how you want help, and ask me anything. What would you like to learn today?");
  const note = document.createElement("div"); note.className = "example-note"; note.textContent = "Example of how Max teaches";
  chat.appendChild(note);
  addMsg("user", "Why is 1/2 bigger than 1/3?");
  addMsg("assistant", "Great question! Picture one pizza. 🍕\n\n- Cut it into **2** pieces: each slice is **1/2**.\n- Cut the same pizza into **3** pieces: each slice is **1/3**.\n\nMore cuts means **smaller slices**. So 1/2 is bigger.\n\n**Your turn:** which is bigger, 1/4 or 1/5? Tell me why.");
  chips.hidden = false;
}

function setStatus(t) { statusEl.textContent = t || ""; }
function setBusy(b) { busy = b; sendBtn.textContent = b ? "Stop" : "Send"; sendBtn.disabled = false; }


async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  if (turns.length === 0) chat.querySelectorAll(".example-note, .msg").forEach((el, i) => { if (i > 0) el.remove(); });
  chips.hidden = true;
  addMsg("user", text);
  turns.push({ role: "user", content: text });
  input.value = ""; autosize();
  const bubble = addMsg("assistant", "");
  bubble.innerHTML = '<span class="thinking">Max is thinking…</span>';
  ctl = new AbortController();
  setBusy(true); setStatus("");
  let answer = "";
  try {
    const eng = await loadEngine(bubble);
    bubble.innerHTML = '<span class="thinking">Max is thinking…</span>';
    const stream = await eng.chat.completions.create({
      stream: true, temperature: 0.6, max_tokens: 600,
      messages: [{ role: "system", content: systemPrompt($("subject").value.trim(), $("level").value, mode) }, ...turns.slice(-12)],
    });
    for await (const chunk of stream) {
      if (ctl.signal.aborted) { eng.interruptGenerate(); break; }
      answer += chunk.choices[0]?.delta?.content || "";
      bubble.innerHTML = md(answer);
      chat.scrollTop = chat.scrollHeight;
    }
    if (!answer.trim()) throw new Error("Max didn't say anything. Try sending again.");
    bubble.innerHTML = md(answer);
    turns.push({ role: "assistant", content: answer });
  } catch (e) {
    if (answer.trim()) { bubble.innerHTML = md(answer); turns.push({ role: "assistant", content: answer }); }
    else { bubble.closest(".msg").remove(); turns.pop(); }
    if (e.name !== "AbortError") setStatus(e.message || "Max couldn't answer that time. Try again.");
  } finally {
    setBusy(false); ctl = null; input.focus();
  }
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); } });
$("composer").addEventListener("submit", (e) => { e.preventDefault(); if (busy) ctl?.abort(); else send(input.value); });
chips.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
  if (/^Quiz me/.test(b.textContent)) setMode("quiz"); send(b.textContent); });
function setMode(m) { mode = m; document.querySelectorAll(".modes button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === m))); }
document.querySelector(".modes").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setMode(b.dataset.mode); });
$("newBtn").addEventListener("click", () => { ctl?.abort(); turns = []; welcome(); setStatus(""); input.focus(); });

async function loadEngine(bubble) {
  const model = $("model").value;
  if (engine && loadedModel === model) return engine;
  if (!navigator.gpu) throw new Error("This browser can't run Max's AI. Use a recent Chrome, Edge or Safari (iPhone: iOS 26 or newer) with WebGPU.");
  if (!loading || loadedModel !== model) {
    loadedModel = model;
    const show = (r) => {
      const pct = Math.round((r.progress || 0) * 100);
      $("loadbar").hidden = false; $("loadfill").style.width = pct + "%";
      $("loadtext").textContent = pct < 100 ? `Downloading Max's brain… ${pct}% (only the first time)` : "Waking Max up…";
    };
    loading = (engine ? engine.reload(model).then(() => engine) : import(WEBLLM_URL).then((webllm) => webllm.CreateMLCEngine(model, { initProgressCallback: show })))
      .then((e) => { engine = e; $("loadbar").hidden = true; setStatus("Max is running on your device. Your chats never leave it."); return e; })
      .catch((err) => { loading = null; loadedModel = null; $("loadbar").hidden = true; throw new Error("Max couldn't load: " + (err.message || err) + ". Close other tabs and try again, or pick the Fast brain."); });
  }
  bubble.innerHTML = '<span class="thinking">Getting Max ready… the first time downloads his brain, so it can take a few minutes.</span>';
  return loading;
}

welcome();
if (!navigator.gpu) setStatus("Heads up: this browser doesn't support WebGPU, which Max needs. Try a recent Chrome, Edge or Safari.");
</script>
</body>
</html>
